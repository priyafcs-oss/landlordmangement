[functions.parse-inbound-bill]
# Called by Resend's webhook, not by an authenticated app user — Svix signature
# verification inside the function is the real auth boundary, not a Supabase JWT.
verify_jwt = false

# Called from the browser via supabase.functions.invoke. Since the migration to Supabase's new
# opaque API key format, src/integrations/supabase/client.ts only sends a real bearer JWT in the
# Authorization header when there's an actual signed-in session (otherwise it's the
# sb_publishable_/sb_secret_ key, which isn't a JWT and would fail gateway verification). Leaving
# verify_jwt at its default (true) here means the gateway would reject every call before the
# function body ever runs, surfacing to the app only as a generic "Edge Function returned a
# non-2xx status code" with no real detail — so verification happens inside the function instead
# (see its own doc comment), which can return a clear 401.
[functions.upload-document]
verify_jwt = false

[functions.extract-bill]
verify_jwt = false

[functions.extract-bank-statement]
verify_jwt = false

[functions.extract-depreciation-report]
verify_jwt = false

[functions.extract-loan-document]
verify_jwt = false

[functions.extract-agency-agreement]
verify_jwt = false

[functions.reparse-document]
verify_jwt = false

[functions.domain-lookup]
verify_jwt = false